# Baut die App mit Vite und deployt dist/ zu GitHub Pages.
# Läuft bei jedem Push auf main (auf Feature-Branches passiert nichts).
# Einmalig nötig: Settings -> Pages -> Source auf "GitHub Actions" umstellen.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Manueller Start über den Actions-Tab (z.B. für den ersten Lauf)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deployments gleichzeitig; ein neuer Push bricht den laufenden Build ab
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
